<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Activation | تفعيل الحساب</title>
    <link href="https://fonts.googleapis.com/css2?family=IBMPlexSansArabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #0c0c0e;
            --primary: #22c55e;
            --primary-glow: rgba(34, 197, 94, 0.15);
            --border: #1f1f23;
            --text-main: #ffffff;
            --text-muted: #88888b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', sans-serif; }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% -20%, #1a3a2a 0%, transparent 60%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        
        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
        .input-group input {
            width: 100%;
            background: #141416;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus { 
            border-color: var(--primary); 
            background: #1a1a1d;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.05);
        }

        /* تنسيق الصورة التوضيحية داخل منطقة الرفع */
        .example-img {
            width: 80px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 12px;
            opacity: 0.6;
            border: 1px solid var(--border);
        }

        .upload-area {
            border: 1px dashed var(--border);
            background: rgba(255,255,255,0.01);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.02);
        }

        .upload-area svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-muted);
            margin-bottom: 8px;
        }

        .upload-area p { font-size: 12px; color: var(--text-muted); }
        .upload-area p span { color: var(--primary); font-weight: 600; }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #052e16;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.15);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* رسالة الخطأ */
        .error-msg {
            color: #ff4444;
            font-size: 11px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>تفعيل الهاك</h1>
            <p style="color: var(--text-muted); font-size: 14px;">أدخل بيانات الحساب الجديد الموثق</p>
        </header>

        <form id="activationForm" onsubmit="return validateForm()">
            <div class="input-group">
                <label>ID الحساب الجديد</label>
                <input type="text" id="user-id" placeholder="اكتب ال ID" maxlength="10" spellcheck="false">
                <div id="id-error" class="error-msg">ID غير صحيح</div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <!-- صورة تمثيلية للمستخدم لما يجب رفعه -->
                <img src="https://i.ibb.co/m5Ym9pY/example.jpg" alt="Example" class="example-img">
                
                <svg id="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <p id="file-status">ارفع سكرين شوت مثل <span>الصورة الموضحة</span></p>
                <input type="file" id="file-input" style="display:none" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">تأكيد البيانات والتفعيل</button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileStatus = document.getElementById('file-status');
        const dropZone = document.getElementById('drop-zone');
        const uploadIcon = document.getElementById('upload-icon');
        const userIdInput = document.getElementById('user-id');
        const idError = document.getElementById('id-error');

        // تحديث حالة رفع الملف
        fileInput.onchange = function() {
            if(this.files[0]) {
                fileStatus.innerHTML = "تم اختيار: <span style='color: var(--primary);'>" + this.files[0].name + "</span>";
                dropZone.style.borderColor = "var(--primary)";
                uploadIcon.style.stroke = "var(--primary)";
            }
        };

        // وظيفة التحقق عند الإرسال
        function validateForm() {
            const idValue = userIdInput.value;
            
            // التحقق: يبدأ بـ 16، طوله 10، وأرقام فقط
            const idPattern = /^16\d{8}$/;

            if (!idPattern.test(idValue)) {
                idError.style.display = "block";
                userIdInput.style.borderColor = "#ff4444";
                return false;
            } else {
                idError.style.display = "none";
                userIdInput.style.borderColor = "var(--primary)";
            }

            if (!fileInput.files[0]) {
                alert("يرجى رفع صورة إثبات التسجيل أولاً.");
                return false;
            }

            alert("تأكد من الإديداع وحاول مره اخرى");
            return true;
        }

        // منع إدخال غير الأرقام في حقل الـ ID
        userIdInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>

</body>
</html>
