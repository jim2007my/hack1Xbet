<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Protocol | شروط الاستخدام</title>
    <link href="https://fonts.googleapis.com/css2?family=IBMPlexSansArabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #0c0c0e;
            --primary: #22c55e;
            --primary-glow: rgba(34, 197, 94, 0.15);
            --border: #1f1f23;
            --text-main: #ffffff;
            --text-muted: #88888b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', sans-serif; }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% -20%, #1a3a2a 0%, transparent 60%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* خط علوي مضيء */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .badge {
            display: table;
            margin: 0 auto 15px auto;
            padding: 6px 14px;
            background: var(--primary-glow);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 50px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        h1 { font-size: 24px; margin-bottom: 30px; text-align: center; font-weight: 700; }
        
        .step-card {
            background: #141416;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            border: 1px solid var(--border);
            transition: 0.3s ease;
        }

        .step-card:hover {
            border-color: rgba(34, 197, 94, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .step-num {
            background: var(--primary);
            color: #000;
            min-width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 0 10px var(--primary-glow);
            flex-shrink: 0;
        }

        .step-text { font-size: 15px; line-height: 1.7; color: #d1d1d6; }
        .step-text b { color: var(--primary); }
        
        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: #052e16;
            padding: 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            margin-top: 30px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.15);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 15px 30px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body>

    <div class="container">
        <!--<div class="badge">SYSTEM PROTOCOL</div>-->
        <h1>شروط تفعيل الخدمة</h1>
        
        <div class="step-card">
            <!--<div class="step-num">1</div>-->
            <div class="step-text">يجب عليك تسجيل الخروج نهائياً من الحساب القديم، ثم إنشاء حساب جديد تماماً وإجراء عملية إيداع بمبلغ <b>500 جنيه</b> كحد أدنى لتنشيط المحفظة.</div>
        </div>

        <div class="step-card">
            <!--<div class="step-num">4</div>-->
            <div class="step-text">بعد إتمام الخطوة الأولى، قم بالانتقال لصفحة التفعيل وسجل بيانات الحساب الجديد بدقة لضمان ربط الهاك بنجاح على خوادمنا.</div>
        </div>

        <a href="activation.html" class="btn-back">قرأت الشروط، بدأ تفعيل الهاك</a>
    </div>

</body>
</html>
